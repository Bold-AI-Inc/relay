<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: #5B5BD6;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg { display: block; }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.1;
    }
    .header-subtitle {
      font-size: 11px;
      color: #6b7280;
      font-weight: 400;
      line-height: 1.1;
    }
    .header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .body { padding: 14px 16px; }

    #no-key-view { display: none; }

    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .capture-btn {
      width: 100%;
      padding: 9px 14px;
      background: #5B5BD6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s;
    }

    .capture-btn:hover:not(:disabled) { background: #4a4ac4; }
    .capture-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .capture-btn-secondary {
      background: #fff;
      color: #5B5BD6;
      border: 1px solid #d1d5db;
      margin-top: 8px;
    }
    .capture-btn-secondary:hover:not(:disabled) {
      background: #f5f5ff;
      border-color: #5B5BD6;
    }
    .capture-btn-secondary:disabled {
      background: #f3f4f6; color: #9ca3af; border-color: #e5e7eb;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .status {
      font-size: 11px;
      color: #6b7280;
    }

    .status.error { color: #dc2626; }

    .settings-link {
      font-size: 11px;
      color: #5B5BD6;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }

    .settings-link:hover { text-decoration: underline; }

    .open-settings-btn {
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      font-size: 12px;
      color: #5B5BD6;
      cursor: pointer;
      margin-top: 10px;
    }
    .open-settings-btn:hover { background: #f5f5ff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="3" width="14" height="10" rx="2" stroke="white" stroke-width="1.4"/>
        <circle cx="8" cy="8" r="2.5" stroke="white" stroke-width="1.4"/>
        <path d="M5.5 3L6.5 1.5H9.5L10.5 3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-text">
      <span class="header-title">Relay</span>
      <span class="header-subtitle">Linear Screenshot Tool</span>
    </div>
  </div>

  <div class="body">
    <div id="no-key-view">
      <p class="hint">Connect your Linear account to start capturing screenshots.</p>
      <button class="open-settings-btn" id="open-settings">Connect in Settings →</button>
    </div>

    <div id="main-view">
      <p class="hint">Drag-select a region, or send the whole visible page.</p>
      <button class="capture-btn" id="capture-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9V6a2 2 0 0 1 2-2h2"/><path d="M15 4h2a2 2 0 0 1 2 2v3"/>
          <path d="M21 15v2a2 2 0 0 1-2 2h-2"/><path d="M9 20H7a2 2 0 0 1-2-2v-2"/>
        </svg>
        Capture Area
      </button>
      <button class="capture-btn capture-btn-secondary" id="capture-full-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
        </svg>
        Capture Whole Page
      </button>
      <div class="settings-row">
        <span class="status" id="status"></span>
        <button class="settings-link" id="settings-link">Settings</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
